  <g id="text_12">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253631" x="63.648" y="25.5744" transform="rotate(-0 63.648 25.5744)">Where were the five dating methods sampled?</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5e6b66" x="63.648" y="50.0832" transform="rotate(-0 63.648 50.0832)">Published locations for all five methods; exact positions remain schematic</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #366f99" x="63.648" y="337.2624" transform="rotate(-0 63.648 337.2624)">Dashed corner brackets = possible FTIR / Raman locations</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5e6b66" x="63.648" y="356.4432" transform="rotate(-0 63.648 356.4432)">The paper identifies a corner, but does not say which one. The brackets do not represent four collected samples.</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253631" x="63.648" y="387.8784" transform="rotate(-0 63.648 387.8784)">Source distinction</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(63.648 416.233144)">FTIR / Raman: Baraldi &amp; Tinti, 2015, Section 2, p.2.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(63.648 432.382636)">Mechanical: Fanti, Malfi &amp; Crosilla, 2015, Section 2 (filter H).</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(494.496 416.233144)">Carbon: Damon et al., 1989, sampling description.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(494.496 432.382636)">WAXS: De Caro et al., 2022, Section 2.1 (near Raes / carbon corner).</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(63.648 474.860975)">Outer rectangle: 442 : 113 = 3.91 : 1. Sampling corner shown at lower left by schematic orientation.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(63.648 489.860975)">Markers are enlarged region symbols, not cutting coordinates. Filter H is a loose-fiber collection region.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5e6b66" transform="translate(63.648 504.860975)">This map does not establish five different sites or that all corner threads came from the identical location.</text>
  </g>
 </g>
